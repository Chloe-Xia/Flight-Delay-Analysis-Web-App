<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Required meta tags -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>Login</title>
  <!-- Template CSS -->
  <link rel="stylesheet" href="/static/css/style-starter.css">
  <!-- Template CSS -->
</head>
<body>

  <header id="site-header" class="fixed-top">
    <div class="container">
      <nav class="navbar navbar-expand-lg stroke">
        <h1><a href="/static/index.html" style="color: #FF1654;">Traversal</a></h1>
          <div class="mobile-position">
            <nav class="navigation">
              <div class="theme-switch-wrapper">
                <label class="theme-switch" for="checkbox">
                  <input type="checkbox" id="checkbox">
                  <div class="mode-container">
                    <i class="gg-sun"></i>
                    <i class="gg-moon"></i>
                  </div>
                </label>
              </div>
            </nav>
          </div>
      </nav>
    </div>
  </header>
  <section class="w3l-about-breadcrumb text-left">
    <div class="breadcrumb-bg breadcrumb-bg-about py-sm-5 py-4">
      <br><br><br><br>
    </div>
  </section>
  <!-- //about breadcrumb -->
<!-- contact-form -->
<section class="w3l-contact" id="contact">
  <div class="contact-infubd py-5">
    <div class="container py-lg-3">
      <div class="contact-grids row">
        <div class="col-lg-6 contact-left">
          <div class="partners">
            <div class="cont-details">
              <h5>Login</h5>

              <br><br>
              <p class="mt-3 mb-4">Input your <b>name</b> and your <b>password</b></p>
              <p class="mt-3 mb-4">Don't have account? <a href="Register.html" style="color: #FF1654;">  Register</a></p>
            </div>
          </div>
        </div>
        <div class="col-lg-6 mt-lg-0 mt-5 contact-right">
          <form method="post" action="/login/" class="signin-form">
            {% csrf_token %}
            <br><br>
            <div class="input-grids">
              <div class="form-group">
                <input type="text" name="name" id="id" placeholder="ID" class="contact-input" required/>
              </div>
              <div class="form-group">
                <input type="password" name="pwd" id="pwd" placeholder="Password" class="contact-input" required/>
              </div>
            </div>
            <div class="text-right">
              <input type="submit" name="login" value="Login" class="btn btn-style btn-secondary">
              <span style="color: red;">{{ error_msg }}</span>
              <!--<button class="btn btn-style btn-secondary">Login</button>-->
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</section>
<!-- /contact-form -->
  <!-- Template JavaScript -->
  <script src="/static/js/jquery-3.3.1.min.js"></script>
  <script src="/static/js/theme-change.js"></script>
  <!--/MENU-JS-->
  <script>
    $(window).on("scroll", function () {
      var scroll = $(window).scrollTop();

      if (scroll >= 80) {
        $("#site-header").addClass("nav-fixed");
      } else {
        $("#site-header").removeClass("nav-fixed");
      }
    });

    //Main navigation Active Class Add Remove
    $(".navbar-toggler").on("click", function () {
      $("header").toggleClass("active");
    });
    $(document).on("ready", function () {
      if ($(window).width() > 991) {
        $("header").removeClass("active");
      }
      $(window).on("resize", function () {
        if ($(window).width() > 991) {
          $("header").removeClass("active");
        }
      });
    });
  </script>
  <script src="/static/js/bootstrap.min.js"></script>

</body>
</html>
